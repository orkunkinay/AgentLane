<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">One Chrome profile, two interaction surfaces</title>
  <desc id="desc">The human uses their own Chrome window with their keyboard and mouse. The agent uses a separate restored, unfocused lane window through screenshots and tab-targeted input. Both windows use the existing Chrome profile.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10" fill="none" stroke="#526775" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="500" rx="22" fill="#f3f6f8"/>
  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="600" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#172c36">One Chrome profile. Separate interaction surfaces.</text>
    <rect x="44" y="85" width="510" height="235" rx="14" fill="#fff" stroke="#b8cee2" stroke-width="2"/>
    <path d="M58 85h482a14 14 0 0 1 14 14v36H44V99a14 14 0 0 1 14-14" fill="#e0ecf7"/>
    <circle cx="68" cy="110" r="5" fill="#7694ae"/><circle cx="85" cy="110" r="5" fill="#7694ae"/><circle cx="102" cy="110" r="5" fill="#7694ae"/>
    <text x="135" y="116" font-size="17" font-weight="600" fill="#244761">Your usual Chrome window</text>
    <text x="74" y="181" font-size="25" font-weight="700" fill="#244761">You keep working</text>
    <text x="74" y="217" font-size="18" fill="#415b6b">Your keyboard, pointer, tabs and scrolling</text>
    <rect x="74" y="244" width="190" height="43" rx="8" fill="#edf4fa"/>
    <text x="92" y="271" font-size="16" fill="#244761">Physical OS input</text>
    <rect x="646" y="85" width="510" height="235" rx="14" fill="#fff" stroke="#a6cec4" stroke-width="2"/>
    <path d="M660 85h482a14 14 0 0 1 14 14v36H646V99a14 14 0 0 1 14-14" fill="#dceee8"/>
    <circle cx="670" cy="110" r="5" fill="#6d9a8b"/><circle cx="687" cy="110" r="5" fill="#6d9a8b"/><circle cx="704" cy="110" r="5" fill="#6d9a8b"/>
    <text x="737" y="116" font-size="17" font-weight="600" fill="#245446">Still agent lane</text>
    <text x="676" y="181" font-size="25" font-weight="700" fill="#245446">The agent works here</text>
    <text x="676" y="217" font-size="18" fill="#415b6b">Leave open, unminimized and unfocused</text>
    <rect x="676" y="244" width="331" height="43" rx="8" fill="#e9f4ee"/>
    <text x="694" y="271" font-size="16" fill="#245446">Screenshots + tab-targeted MCP input</text>
    <path d="M299 323v38h602v-38M600 362v29" fill="none" stroke="#526775" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="302" y="402" width="596" height="62" rx="14" fill="#e6ebef"/>
    <text x="600" y="429" text-anchor="middle" font-size="19" font-weight="650" fill="#263d49">Existing Chrome profile and authenticated sessions</text>
    <text x="600" y="451" text-anchor="middle" font-size="15" fill="#526775">No profile copying or cookie export</text>
  </g>
</svg>
