<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Still agent lane</title>
    <link rel="stylesheet" href="setup.css" />
    <link rel="stylesheet" href="anchor.css" />
  </head>
  <body class="lane-page">
    <main class="lane-content">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i></span
        ><span>still<span class="brand-period">.</span></span>
      </div>
      <div class="lane-illustration" aria-hidden="true">
        <div class="illustration-toolbar"><i></i><i></i><i></i></div>
        <div class="illustration-line"></div>
        <div class="illustration-line short"></div>
        <span class="illustration-cursor"
          ><svg width="25" height="30" viewBox="0 0 25 30" fill="none">
            <path
              d="m3 2 18 16-9 1-5 8L3 2Z"
              fill="#3d6346"
              stroke="#fafbf8"
              stroke-width="2"
              stroke-linejoin="round"
            /></svg
        ></span>
      </div>
      <p class="lane-eyebrow">AGENT WORKSPACE</p>
      <h1>A little space for your agent.</h1>
      <p class="lane-description">
        Keep this window open and unminimized.<br />Switch back to your usual window to let the
        agent work.
      </p>
      <div class="lane-rule">
        <span aria-hidden="true">↗</span><span>Your own tabs are where you keep browsing.</span>
      </div>
      <p class="lane-footnote">Closing this window stops its agent sessions.</p>
    </main>
  </body>
</html>
